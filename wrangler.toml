name = "pb-group-wrapped"
main = "src/worker.js"
compatibility_date = "2025-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/r/*"]

[[durable_objects.bindings]]
name = "RECAP"
class_name = "Recap"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Recap", "Limiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

[observability]
enabled = false
